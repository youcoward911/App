name: iOS Build
on: [workflow_dispatch]
defaults:
  run:
    working-directory: AppLock
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Certs
        working-directory: .
        env:
          DIST_CERT_BASE64: ${{ secrets.DIST_CERT_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          MAIN_PROFILE_BASE64: ${{ secrets.MAIN_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          echo "$DIST_CERT_BASE64" | base64 --decode > $RUNNER_TEMP/dist-cert.p12
          security import $RUNNER_TEMP/dist-cert.p12 -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$MAIN_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/main.mobileprovision
      - name: Prebuild
        env:
          ENABLE_FAMILY_CONTROLS: "1"
        run: npx expo prebuild --platform ios --clean --no-install
      - run: cd ios && pod install
      - name: Archive
        run: xcodebuild archive -workspace ios/ScrollPig.xcworkspace -scheme ScrollPig -configuration Release -archivePath $RUNNER_TEMP/ScrollPig.xcarchive -destination generic/platform=iOS CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=78KK2B4DTZ CODE_SIGN_IDENTITY="Apple Distribution" -allowProvisioningUpdates
      - name: Export
        run: |
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n<key>method</key>\n<string>ad-hoc</string>\n<key>teamID</key>\n<string>78KK2B4DTZ</string>\n<key>signingStyle</key>\n<string>manual</string>\n<key>provisioningProfiles</key>\n<dict>\n<key>com.paypig.app</key>\n<string>ScrollPig AdHoc</string>\n</dict>\n</dict>\n</plist>' > $RUNNER_TEMP/ExportOptions.plist
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/ScrollPig.xcarchive -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist -exportPath $RUNNER_TEMP/export
      - uses: actions/upload-artifact@v4
        with:
          name: ScrollPig.ipa
          path: ${{ runner.temp }}/export/*.ipa
      - if: always()
        run: security delete-keychain $RUNNER_TEMP/build.keychain 2>/dev/null || true
